name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # daily refresh: stats, latest release, docs corpus (DESIGN.md §5)
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out obs-studio docs (sparse)
        uses: actions/checkout@v4
        with:
          repository: obs-rust/obs-studio
          path: .obs-studio
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.md
            /.mcp.json
            /mcp
            /rust/obs-mcp/Cargo.toml
            /rust/obs-mcp/src/
            /docs/
            !/docs/images/
            !/docs/rust-port/native-graph/
      - uses: astral-sh/setup-uv@v6
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run tools/build.py --obs-studio .obs-studio --out _site
      - name: Check site
        run: uv run tools/check.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
