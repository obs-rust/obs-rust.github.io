<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#2a1c12"/>
      <stop offset="0.55" stop-color="#120c08"/>
      <stop offset="1" stop-color="#050404"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1b0"/>
      <stop offset="0.3" stop-color="#e8a35a"/>
      <stop offset="0.6" stop-color="#9a5a24"/>
      <stop offset="1" stop-color="#f3b874"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.25" stop-color="#e09a52"/>
      <stop offset="0.6" stop-color="#8a4c1c"/>
      <stop offset="1" stop-color="#3a1d0a"/>
    </linearGradient>
    <linearGradient id="bronzeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8743a"/>
      <stop offset="1" stop-color="#4a250c"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.4" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff5e14"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="disc"><circle cx="200" cy="200" r="178"/></clipPath>
  </defs>

  <!-- disc -->
  <circle cx="200" cy="200" r="192" fill="url(#ring)"/>
  <circle cx="200" cy="200" r="181" fill="#0b0705"/>
  <circle cx="200" cy="200" r="178" fill="url(#bg)"/>

  <g clip-path="url(#disc)">
    <!-- sunrise halo behind the head -->
    <circle cx="200" cy="175" r="150" fill="url(#halo)"/>
    <circle cx="200" cy="175" r="118" fill="none" stroke="#ffb565" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="200" cy="175" r="132" fill="none" stroke="#ffb565" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- shoulders / pauldrons -->
    <path d="M40 420 C45 330 95 300 150 292 L250 292 C305 300 355 330 360 420 Z" fill="url(#bronzeDark)" filter="url(#soft)"/>
    <path d="M150 292 L250 292 L238 330 L162 330 Z" fill="#2a1508"/>
    <circle cx="200" cy="352" r="20" fill="#120a05" stroke="url(#ring)" stroke-width="4"/>
    <circle cx="200" cy="352" r="10" fill="url(#orb)" filter="url(#glow)"/>
    <path d="M70 380 C90 340 120 322 150 318" fill="none" stroke="#ffb565" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
    <path d="M330 380 C310 340 280 322 250 318" fill="none" stroke="#ffb565" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

    <!-- neck -->
    <rect x="172" y="262" width="56" height="40" rx="6" fill="#3a1d0a"/>
    <path d="M176 272 H224 M176 284 H224" stroke="#8a4c1c" stroke-width="3"/>
  </g>

  <!-- antenna -->
  <line x1="200" y1="96" x2="200" y2="58" stroke="url(#bronze)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="50" r="13" fill="url(#orb)" filter="url(#glow)"/>

  <!-- head -->
  <g filter="url(#soft)">
    <rect x="104" y="92" width="192" height="182" rx="58" fill="url(#bronze)"/>
  </g>
  <!-- top sheen -->
  <path d="M130 120 C150 100 250 100 270 120" fill="none" stroke="#fff1d6" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  <!-- crest ridge -->
  <path d="M200 94 L200 140" stroke="#5a2e10" stroke-width="5" stroke-linecap="round"/>
  <!-- ear discs -->
  <circle cx="100" cy="186" r="24" fill="url(#bronzeDark)" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="100" cy="186" r="9" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="300" cy="186" r="24" fill="url(#bronzeDark)" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="300" cy="186" r="9" fill="url(#orb)" filter="url(#glow)"/>

  <!-- face plate -->
  <rect x="128" y="146" width="144" height="92" rx="34" fill="#0d0805" stroke="#2e170a" stroke-width="3"/>
  <!-- visor eyes -->
  <g filter="url(#glow)">
    <rect x="146" y="176" width="44" height="20" rx="10" fill="url(#visor)"/>
    <rect x="210" y="176" width="44" height="20" rx="10" fill="url(#visor)"/>
  </g>
  <!-- smile / speaker grille -->
  <path d="M176 216 Q200 230 224 216" fill="none" stroke="#ffb15a" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <!-- cheek bolts -->
  <circle cx="122" cy="252" r="5" fill="#3a1d0a" stroke="#e09a52" stroke-width="2"/>
  <circle cx="278" cy="252" r="5" fill="#3a1d0a" stroke="#e09a52" stroke-width="2"/>

  <!-- ring highlight -->
  <path d="M60 120 A170 170 0 0 1 200 22" fill="none" stroke="#fff3dc" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round"/>
</svg>
